<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>IVY大分 ARスタンプラリー スタンプ帳</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color: transparent; }
  html, body { background:#0b4a8f; color:#fff; font-family:"Hiragino Kaku Gothic ProN","Yu Gothic","Meiryo",sans-serif; min-height:100%; }
  .wrap { max-width:460px; margin:0 auto; padding:16px 16px 40px; padding-top:max(16px, env(safe-area-inset-top)); }
  h1 { font-size:18px; font-weight:800; text-align:center; margin:6px 0 2px; }
  .sub { text-align:center; font-size:12px; opacity:.8; margin-bottom:14px; }
  .grid { display:grid; grid-template-columns:repeat(3,1fr); gap:10px; }
  .stamp { background:rgba(255,255,255,.12); border:2px dashed rgba(255,255,255,.45); border-radius:14px; padding:10px 4px; text-align:center; min-height:92px; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:4px; }
  .stamp .no { font-size:12px; font-weight:800; opacity:.85; }
  .stamp .nm { font-size:12px; font-weight:700; }
  .stamp .mk { font-size:30px; line-height:1; opacity:.3; }
  .stamp.done { background:#fff; color:#0b4a8f; border:2px solid #ffd66b; }
  .stamp.done .mk { opacity:1; }
  .card { margin-top:14px; background:#fff; color:#1f2a3a; border-radius:16px; padding:14px 16px; box-shadow:0 6px 20px rgba(0,0,0,.3); }
  .row { display:flex; justify-content:space-between; font-size:14px; font-weight:700; padding:4px 0; }
  .prize { text-align:center; margin-top:8px; }
  .prize .tag { display:inline-block; background:#ffd66b; color:#0b2037; font-weight:900; border-radius:14px; padding:3px 12px; font-size:12px; }
  .prize .big { font-size:26px; font-weight:900; color:#0b4a8f; margin-top:6px; }
  .prize .txt { font-size:13px; font-weight:700; margin-top:4px; line-height:1.6; }
  .proof { margin-top:12px; text-align:center; font-size:12px; font-weight:700; color:#38506b; line-height:1.8; }
  .proof .clock { font-size:22px; font-weight:900; color:#0b4a8f; font-variant-numeric:tabular-nums; }
  .proof .code { font-family:Consolas,Menlo,monospace; font-size:16px; letter-spacing:.12em; }
  .received { display:none; margin-top:12px; background:#e5f4e4; border:2px solid #59c98a; color:#1d6b3a; border-radius:12px; padding:10px; text-align:center; font-weight:900; font-size:16px; }
  details { margin-top:14px; background:rgba(0,0,0,.25); border-radius:12px; padding:10px 14px; }
  summary { font-size:13px; font-weight:700; cursor:pointer; }
  .staff input { width:100%; margin-top:8px; padding:10px; border-radius:10px; border:none; font-size:16px; }
  .staff button { width:100%; margin-top:8px; padding:11px; border:none; border-radius:10px; background:#ffd66b; color:#0b2037; font-weight:800; font-size:15px; }
  .staff .msg { font-size:12px; margin-top:6px; min-height:16px; }
  .note { margin-top:14px; font-size:11px; opacity:.75; line-height:1.7; text-align:center; }
  a.back { display:block; text-align:center; margin-top:14px; color:#fff; font-size:13px; }
  .wrap { padding-bottom: 110px; }
  #camBar { position:fixed; left:0; right:0; bottom:0; z-index:10; padding:10px 16px calc(10px + env(safe-area-inset-bottom)); background:linear-gradient(transparent, #0b4a8f 35%); }
  #camBtn { display:block; width:100%; max-width:460px; margin:0 auto; background:#ffd66b; color:#0b2037; border:none; border-radius:30px; font-weight:900; font-size:18px; padding:15px; text-align:center; text-decoration:none; box-shadow:0 4px 14px rgba(0,0,0,.35); }
  .nextHint { margin-top:10px; text-align:center; font-size:13px; font-weight:800; color:#ffd66b; }
</style>
</head>
<body>
<div class="wrap">
  <h1>📒 IVY大分 ARスタンプ帳</h1>
  <div class="sub">9つのスポットを回って、スタンプを集めよう</div>
  <div class="grid" id="grid"></div>

  <div class="card">
    <div class="row"><span>スタンプ</span><span id="cnt">0 / 9</span></div>
    <div class="row"><span>まちがい 合計</span><span id="mis">0回</span></div>
    <div class="row"><span>かかった時間</span><span id="dur">-</span></div>
    <div class="prize" id="prize"></div>
    <div class="proof">
      <div>いまの時刻(係の人が確認します)</div>
      <div class="clock" id="clock">--:--:--</div>
      <div>確認コード <span class="code" id="code">------</span></div>
    </div>
    <div class="received" id="received">✅ 景品は受け取り済みです</div>
  </div>

  <details class="staff">
    <summary>係の人用</summary>
    <input type="password" id="pin" inputmode="numeric" placeholder="係の暗証番号">
    <button id="recvBtn">景品を渡した(受け取り済みにする)</button>
    <div class="msg" id="msg"></div>
  </details>

  <div class="note">景品は、この画面を係の人に見せてください。<br>画面のスクリーンショットでは受け付けません。</div>
  </div>
<div id="camBar"><a id="camBtn" href="./index.html">📷 マーカーを読みに行く</a></div>

<script>
// ===== 設定(本番前に変更してください) =====
const STAFF_PIN = '4455';                  // 係の暗証番号
const PRIZE = { partial: 1, complete: 2, perfect: 3 };   // 参加 / 完走 / 完走かつまちがい0回 の個数
const SPOTS = [
  ['spot1','①','サーバーラック','🗄️'], ['spot2','②','平均','📊'], ['spot3','③','迷路暗号','🧩'],
  ['spot4','④','数列','🔢'], ['spot5','⑤','ベン図','🧮'], ['spot6','⑥','2進数','💾'],
  ['spot7','⑦','五大装置','🖥️'], ['spot8','⑧','増加率','📈'], ['spot9','⑨','間違い探し','🔍']
];
// ============================================
function load(key){ try { const s = localStorage.getItem(key); return s ? JSON.parse(s) : {}; } catch(e){ return {}; } }
function raw(key){ try { return localStorage.getItem(key); } catch(e){ return null; } }
const cleared = load('ivyArStampCleared');
const mist = load('ivyArStampMistakes');
const start = Number(raw('ivyArStampStart')) || 0;
let done = 0, total = 0, last = 0;
const grid = document.getElementById('grid');
SPOTS.forEach(([k,no,nm,ic])=>{
  const ok = !!cleared[k]; if (ok){ done++; last = Math.max(last, Number(cleared[k])||0); }
  const d = document.createElement('div'); d.className = 'stamp' + (ok ? ' done' : '');
  d.innerHTML = '<div class="no">'+no+'</div><div class="mk">'+(ok ? ic : '？')+'</div><div class="nm">'+nm+'</div>';
  grid.appendChild(d);
});
Object.values(mist).forEach(v=> total += Number(v)||0);
document.getElementById('cnt').textContent = done + ' / 9';
document.getElementById('mis').textContent = total + '回';
if (start && last && done > 0){
  const m = Math.max(1, Math.round((last - start) / 60000));
  document.getElementById('dur').textContent = (m >= 60 ? Math.floor(m/60) + '時間' : '') + (m % 60) + '分';
}
// 景品
let tag = '', big = '', txt = '';
if (done === 0){ tag = 'まだスタンプがありません'; big = '🎯'; txt = 'スポットのマーカーを見つけて、問題に挑戦しよう!'; }
else if (done < 9){ tag = '参加賞'; big = 'お菓子 ' + PRIZE.partial + '個'; txt = 'あと ' + (9 - done) + ' スポットで完走! 完走すると もっともらえるよ。'; }
else if (total === 0){ tag = '🎉 完走・まちがい0回!'; big = 'お菓子 ' + PRIZE.perfect + '個'; txt = 'すばらしい! 全問ノーミスでした。'; }
else { tag = '🏅 完走!'; big = 'お菓子 ' + PRIZE.complete + '個'; txt = '9スポットすべてクリア! おつかれさまでした。'; }
document.getElementById('prize').innerHTML = '<span class="tag">'+tag+'</span><div class="big">'+big+'</div><div class="txt">'+txt+'</div>';
// 確認コード(スタンプ数・まちがい数・最終クリア時刻から計算)
function hash(s){ let h = 5381; for (let i=0;i<s.length;i++) h = ((h << 5) + h + s.charCodeAt(i)) >>> 0; return h.toString(36).toUpperCase().padStart(6,'0').slice(-6); }
document.getElementById('code').textContent = hash(done + '|' + total + '|' + last + '|' + start);
// 時計
function tick(){ const d = new Date(); const p = n=> String(n).padStart(2,'0'); document.getElementById('clock').textContent = p(d.getHours())+':'+p(d.getMinutes())+':'+p(d.getSeconds()); }
tick(); setInterval(tick, 1000);
// 受け取り済み
function showReceived(){ const t = raw('ivyArStampReceived'); if (t){ const r = document.getElementById('received'); r.style.display = 'block'; const d = new Date(Number(t)); r.textContent = '✅ 景品は受け取り済みです(' + d.getHours() + ':' + String(d.getMinutes()).padStart(2,'0') + ')'; } }
showReceived();
document.getElementById('recvBtn').addEventListener('click', ()=>{
  const m = document.getElementById('msg');
  if (document.getElementById('pin').value !== STAFF_PIN){ m.textContent = '暗証番号がちがいます'; return; }
  if (raw('ivyArStampReceived')){ m.textContent = 'すでに受け取り済みです'; return; }
  try { localStorage.setItem('ivyArStampReceived', String(Date.now())); } catch(e){}
  m.textContent = '受け取り済みにしました'; showReceived();
});
if (/[?&]embed=1/.test(location.search)){
  document.getElementById('camBtn').addEventListener('click', e=>{ e.preventDefault(); parent.postMessage({type:'close'}, '*'); });
}
if (done < 9){
  const rest = SPOTS.filter(s=>!cleared[s[0]]).map(s=>s[1]+s[2]).join(' ・ ');
  const n = document.createElement('div'); n.className='nextHint'; n.textContent = '未クリア: ' + rest;
  document.querySelector('.card').appendChild(n);
}
</script>
</body>
</html>
