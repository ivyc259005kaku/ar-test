<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>IVY大分 ARスタンプラリー</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/aframe/1.4.2/aframe.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>
<style>
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color: transparent; }
  html, body { width:100%; height:100dvh; overflow:hidden; background:transparent; font-family:"Hiragino Kaku Gothic ProN","Yu Gothic","Meiryo",sans-serif; }
  a-scene { position:fixed; inset:0; background:transparent; }
  video { position:fixed !important; top:0; left:0; width:100% !important; height:100% !important; object-fit:cover; z-index:-1; }
  #start { position:fixed; inset:0; z-index:50; background:#0b4a8f; color:#fff; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:14px; padding:24px; text-align:center; }
  #start h1 { font-size:22px; font-weight:900; }
  #start p { font-size:14px; line-height:1.8; opacity:.9; }
  #start button { background:#ffd66b; color:#0b2037; border:none; border-radius:30px; font-size:18px; font-weight:900; padding:14px 38px; }
  #bar { position:fixed; left:0; right:0; bottom:0; z-index:20; display:none; align-items:center; justify-content:space-between; gap:10px; padding:10px 14px calc(10px + env(safe-area-inset-bottom)); background:rgba(11,74,143,.88); color:#fff; font-weight:800; font-size:14px; }
  #bar button { background:#ffd66b; color:#0b2037; border:none; border-radius:20px; font-weight:800; font-size:14px; padding:8px 16px; }
  #hint { position:fixed; left:0; right:0; top:max(14px, env(safe-area-inset-top)); z-index:20; text-align:center; display:none; }
  #hint span { display:inline-block; background:rgba(0,0,0,.55); color:#fff; font-size:13px; font-weight:700; padding:7px 16px; border-radius:18px; }
  #frame { position:fixed; inset:0; width:100%; height:100%; border:0; z-index:40; display:none; background:transparent; }
  #frame.goal { background:#0b4a8f; }
  #err { position:fixed; inset:0; z-index:60; display:none; background:#0b4a8f; color:#fff; padding:30px; text-align:center; align-items:center; justify-content:center; font-size:15px; line-height:1.9; }
</style>
</head>
<body>

<div id="start">
  <h1>📍 IVY大分<br>ARスタンプラリー</h1>
  <p>このページを開いたままで OK。<br>あとは、校内の <b>マーカー(ポスター)</b> に<br>カメラを向けるだけで問題が出ます。</p>
  <button id="goBtn">カメラを起動してスタート</button>
  <p style="font-size:12px;opacity:.7">※ SafariまたはChromeで開いてください(LINE等のアプリ内ブラウザは不可)<br>※ 途中でページを閉じても、同じブラウザで開き直せば続きから</p>
</div>

<div id="err">カメラを使えませんでした。<br>SafariまたはChromeで開き、<br>カメラの許可をオンにしてください。<br><br>(LINEなどのアプリ内ブラウザでは動きません)</div>

<a-scene id="scene" mindar-image="imageTargetSrc: ./all.mind; autoStart: false; uiScanning: no; uiLoading: no; filterMinCF: 0.001; filterBeta: 10;"
         color-space="sRGB" renderer="colorManagement: true, physicallyCorrectLights: true, alpha: true" vr-mode-ui="enabled: false" device-orientation-permission-ui="enabled: false">
  <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>
  <a-entity id="t0" mindar-image-target="targetIndex: 0"></a-entity>
  <a-entity id="t1" mindar-image-target="targetIndex: 1"></a-entity>
  <a-entity id="t2" mindar-image-target="targetIndex: 2"></a-entity>
  <a-entity id="t3" mindar-image-target="targetIndex: 3"></a-entity>
  <a-entity id="t4" mindar-image-target="targetIndex: 4"></a-entity>
  <a-entity id="t5" mindar-image-target="targetIndex: 5"></a-entity>
  <a-entity id="t6" mindar-image-target="targetIndex: 6"></a-entity>
  <a-entity id="t7" mindar-image-target="targetIndex: 7"></a-entity>
  <a-entity id="t8" mindar-image-target="targetIndex: 8"></a-entity>
</a-scene>

<div id="hint"><span>📷 マーカーにカメラを向けてください</span></div>
<div id="bar"><span id="stamps">スタンプ 0 / 9</span><button id="goalBtn">📒 スタンプ帳</button></div>
<iframe id="frame" allow="" title="spot"></iframe>

<script>
// マーカーの順番 = all.mind に入れた画像の順番(①〜⑨)
const FILES = [
  'spot6_marker_binary.html', 'spot7_marker_godai.html', 'spot8_marker_zouka.html',
  'spot9_marker_sagasu.html', 'spot1_marker_rack.html', 'spot2_marker_heikin.html',
  'spot3_marker_meiro.html', 'spot4_marker_suuretsu.html', 'spot5_marker_venn.html'
];
const frame = document.getElementById('frame');
const scene = document.getElementById('scene');
let open = false;

function clearedCount(){
  try { return Object.keys(JSON.parse(localStorage.getItem('ivyArStampCleared') || '{}')).length; } catch(e){ return 0; }
}
function refreshBar(){ document.getElementById('stamps').textContent = 'スタンプ ' + clearedCount() + ' / 9'; }
function show(url, isGoal){
  open = true; frame.className = isGoal ? 'goal' : ''; frame.src = url; frame.style.display = 'block';
  document.getElementById('bar').style.display = 'none'; document.getElementById('hint').style.display = 'none';
}
function closeFrame(){
  frame.style.display = 'none'; frame.src = 'about:blank'; open = false;
  document.getElementById('bar').style.display = 'flex'; document.getElementById('hint').style.display = 'block';
  refreshBar();
}
FILES.forEach((f, i)=>{
  document.getElementById('t' + i).addEventListener('targetFound', ()=>{
    if (open) return;
    if (navigator.vibrate) { try { navigator.vibrate(60); } catch(e){} }
    show('./' + f + '?embed=1', false);
  });
});
window.addEventListener('message', e=>{
  const d = e.data || {};
  if (d.type === 'close') closeFrame();
  else if (d.type === 'goal') show('./goal.html?embed=1', true);
  else if (d.type === 'cleared') refreshBar();
});
document.getElementById('goalBtn').addEventListener('click', ()=> show('./goal.html?embed=1', true));
// goal.html の「もどる」代わり: 画面タップで閉じられるよう、ゴール表示中は下部に戻るボタン
frame.addEventListener('load', ()=>{
  if (!frame.className) return;
  try {
    const d = frame.contentDocument; const b = d.createElement('button');
    b.textContent = '📷 カメラにもどる'; b.style.cssText = 'display:block;margin:18px auto 30px;background:#ffd66b;color:#0b2037;border:none;border-radius:24px;font-weight:800;font-size:15px;padding:12px 28px';
    b.onclick = closeFrame; d.querySelector('.wrap').appendChild(b);
  } catch(e){}
});

document.getElementById('goBtn').addEventListener('click', async ()=>{
  document.getElementById('goBtn').disabled = true;
  try {
    await scene.components['mindar-image-system'] ? 0 : 0;
    const sys = scene.systems['mindar-image-system'];
    await sys.start();
    document.getElementById('start').style.display = 'none';
    document.getElementById('bar').style.display = 'flex'; document.getElementById('hint').style.display = 'block';
    refreshBar();
  } catch(err){
    document.getElementById('err').style.display = 'flex';
  }
});
</script>
</body>
</html>
