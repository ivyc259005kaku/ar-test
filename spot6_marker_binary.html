<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>スポット6 マーカーAR 2進数</title>

<script src="https://cdnjs.cloudflare.com/ajax/libs/aframe/1.4.2/aframe.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

<style>
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color: transparent; user-select:none; }
  html, body { width:100%; height:100%; overflow:hidden; background: transparent !important;
    font-family: "Hiragino Kaku Gothic ProN", "Yu Gothic", "Meiryo", sans-serif; }
  a-scene { position:fixed; top:0; left:0; width:100%; height:100%; z-index:1; background: transparent !important; }
  video { position: fixed !important; top:0 !important; left:0 !important; width:100% !important; height:100% !important; object-fit: cover !important; z-index:-1 !important; }
  #ui { position:fixed; top:0; left:0; width:100%; z-index:20; padding: 12px 16px; padding-top: max(12px, env(safe-area-inset-top)); background: linear-gradient(rgba(0,0,0,0.65), transparent); color:#fff; pointer-events:none; }
  #ui h1 { font-size:14px; font-weight:700; } #ui p { font-size:12px; opacity:0.85; margin-top:2px; }
  #mistakeBadge { position:fixed; top:max(10px, env(safe-area-inset-top)); right:12px; z-index:21; background:rgba(0,0,0,0.55); color:#fff; border:2px solid rgba(255,255,255,0.6); border-radius:18px; padding:5px 12px; font-size:12px; font-weight:700; pointer-events:none; backdrop-filter: blur(4px); }
  #searchHint { position:fixed; bottom:0; left:0; width:100%; z-index:20; padding: 22px; padding-bottom: max(26px, env(safe-area-inset-bottom)); background: linear-gradient(transparent, rgba(0,0,0,0.65)); color:#fff; text-align:center; pointer-events:none; }
  #searchHint .badge { display:inline-block; background: rgba(0,0,0,0.4); border:2px solid rgba(255,255,255,0.6); border-radius:24px; padding:10px 22px; font-size:16px; font-weight:600; backdrop-filter: blur(6px); }
  #gameLayer { position:fixed; top:0; left:0; width:100%; height:100%; z-index:30; display:none; pointer-events:none; }
  #qBox { position:fixed; top:max(54px, calc(env(safe-area-inset-top) + 44px)); left:50%; transform:translateX(-50%); width:92%; max-width:440px; background:rgba(255,255,255,0.95); color:#1f2a3a; border-radius:14px; padding:10px 13px; box-shadow:0 6px 20px rgba(0,0,0,0.3); pointer-events:none; z-index:31; display:none; }
  #qBox .q { font-size:13.5px; font-weight:800; line-height:1.65; } #qBox .q b { color:#0b4a8f; }
  #qBox .sub { font-size:12px; font-weight:600; opacity:.8; margin-top:3px; }
  .slot { position:absolute; border:3px dashed rgba(255,255,255,0.9); border-radius:14px; background:rgba(0,0,0,0.4); z-index:2; pointer-events:none; color:#fff; }
  .slot .lb { position:absolute; left:8px; top:4px; font-size:11px; font-weight:700; opacity:.85; }
  .slot .nm { position:absolute; right:12px; top:50%; transform:translateY(-50%); font-size:28px; font-weight:900; color:#ffd66b; }
  .card { position:absolute; border-radius:12px; background:rgba(255,255,255,0.97); display:flex; align-items:center; justify-content:center; box-shadow:0 6px 16px rgba(0,0,0,0.4); touch-action:none; z-index:35; pointer-events:auto; cursor:grab; font-family:"Consolas","Menlo",monospace; font-weight:900; color:#0b2037; letter-spacing:.04em; }
  #resultBadge { position:fixed; bottom:84px; left:0; width:100%; z-index:31; text-align:center; pointer-events:none; display:none; }
  #resultBadge .badge { display:inline-block; background: rgba(0,0,0,0.6); border:2px solid rgba(255,255,255,0.65); border-radius:22px; padding:8px 18px; font-size:14px; font-weight:700; color:#fff; }
  #checkBtn { position:fixed; bottom:max(20px, env(safe-area-inset-bottom)); left:50%; transform:translateX(-50%); z-index:33; display:none; background:#fff; color:#0b4a8f; border:none; border-radius:30px; padding:14px 40px; font-size:16px; font-weight:800; box-shadow:0 6px 18px rgba(0,0,0,0.35); pointer-events:auto; }
  @media (max-height:640px){ #qBox .q{font-size:12px;} #qBox .sub{font-size:11px;} #checkBtn{padding:11px 32px;font-size:15px;} }
  #clearScreen { position:fixed; top:0; left:0; width:100%; height:100%; background: rgba(11, 74, 143, 0.94); z-index:40; display:none; flex-direction:column; align-items:center; justify-content:center; color:#fff; text-align:center; padding:26px; backdrop-filter: blur(4px); pointer-events:auto; }
  #clearScreen.show { display:flex; animation: fadeIn 0.5s ease; }
  #clearScreen .stamp { width:120px; height:120px; border-radius:50%; background:#fff; display:flex; align-items:center; justify-content:center; font-size:52px; margin-bottom:18px; animation: pop 0.5s cubic-bezier(.34,1.56,.64,1); box-shadow:0 8px 24px rgba(0,0,0,0.3); }
  #clearScreen h2 { font-size:24px; margin-bottom:10px; font-weight:800; }
  #clearScreen p { font-size:14px; opacity:0.95; max-width:320px; line-height:1.9; }
  #clearScreen .score { margin-top:14px; font-size:15px; font-weight:800; background:rgba(255,255,255,0.18); padding:8px 18px; border-radius:16px; }
  @keyframes pop { 0%{transform:scale(0);} 80%{transform:scale(1.15);} 100%{transform:scale(1);} }
  @keyframes fadeIn { from{opacity:0;} to{opacity:1;} }

  html, body { touch-action: none; overscroll-behavior: none; }
  @supports (height: 100dvh) { html, body, a-scene, #gameLayer, #clearScreen { height: 100dvh; } video { height: 100dvh !important; } }
  @media (max-width:360px), (max-height:640px) {
    #mistakeBadge { font-size:11px; padding:4px 9px; }
  }
  #rotateMsg { position:fixed; inset:0; z-index:90; display:none; align-items:center; justify-content:center; background:#0b4a8f; color:#fff; font-size:18px; font-weight:800; text-align:center; padding:20px; line-height:1.8; }
  @media (orientation:landscape) and (max-height:500px) { #rotateMsg { display:flex; } }
</style>
</head>
<body>
<div id="rotateMsg">📱 スマホを縦向きにしてください</div>
<div id="ui"><h1>IVY大分 ARスタンプラリー</h1><p>スポット6 / 9 ・ 2進数</p></div>
<div id="mistakeBadge">まちがい 0回</div>
<div id="searchHint"><div class="badge">マーカーにカメラを向けてください<br><span style="font-size:12px;font-weight:500;opacity:.85">読み込みに時間がかかることがあります</span></div></div>

<a-scene mindar-image="imageTargetSrc: ./binary.mind; autoStart: true; uiScanning: no;" color-space="sRGB"
  renderer="colorManagement: true, physicallyCorrectLights, alpha: true" vr-mode-ui="enabled: false"
  device-orientation-permission-ui="enabled: false">
  <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>
  <a-entity id="target" mindar-image-target="targetIndex: 0"></a-entity>
</a-scene>

<div id="qBox">
  <div class="q">コンピュータは<b>2進数</b>(0と1)で数を表します。<br>4つの2進数カードを、同じ大きさの<b>10進数</b>の枠に置こう。</div>
  <div class="sub">ヒント: 右から順に 1・2・4・8… の位です(例: 11 は 2+1 = 3)</div>
</div>
<div id="gameLayer"></div>
<div id="resultBadge"><div class="badge" id="resultText"></div></div>
<button id="checkBtn">これで決定</button>
<div id="clearScreen"><div class="stamp">💾</div><h2>正解!</h2><p id="clearText"></p><div class="score" id="scoreText"></div></div>

<script>
const STORE_KEY = 'ivyArStampMistakes';
const SPOT_KEY = 'spot6';
let memStore = {};
function loadStore(){ try { const s = localStorage.getItem(STORE_KEY); return s ? JSON.parse(s) : {}; } catch(e){ return memStore; } }
function saveStore(o){ memStore = o; try { localStorage.setItem(STORE_KEY, JSON.stringify(o)); } catch(e){} }
if (/[?&]reset=1/.test(location.search)){ try { localStorage.removeItem(STORE_KEY); } catch(e){} memStore = {}; }
function spotMistakes(){ return Number(loadStore()[SPOT_KEY]) || 0; }
function totalMistakes(){ return Object.values(loadStore()).reduce((a,b)=> a + (Number(b)||0), 0); }
function addMistake(){ const s = loadStore(); s[SPOT_KEY] = (Number(s[SPOT_KEY]) || 0) + 1; saveStore(s); updateBadge(); }
function updateBadge(){ document.getElementById('mistakeBadge').textContent = 'まちがい 合計 ' + totalMistakes() + '回'; }
updateBadge();

// カード(2進数) と 正しい枠(10進数)
const CARDS = [ {id:'c4', bin:'100', slot:0}, {id:'c5', bin:'101', slot:1}, {id:'c6', bin:'110', slot:2}, {id:'c9', bin:'1001', slot:3} ];
const SLOT_NUMS = [4,5,6,9];
const targetEntity = document.getElementById('target');
const searchHint = document.getElementById('searchHint');
const gameLayer = document.getElementById('gameLayer');
const qBox = document.getElementById('qBox');
const resultBadge = document.getElementById('resultBadge');
const resultText = document.getElementById('resultText');
const checkBtn = document.getElementById('checkBtn');
const clearScreen = document.getElementById('clearScreen');
const clearText = document.getElementById('clearText');
const scoreText = document.getElementById('scoreText');
let W, H, sw = 140, sh = 58, cw = 76, ch = 48;
let slotPos = [], homePos = [];
let slotEls = [], cardEls = {};
let slotOfCard = {}, cardInSlot = [null,null,null,null], homeIndex = {};
let lastSig = '', cleared = false, gameStarted = false;
function setResult(msg){ resultText.textContent = msg; resultBadge.style.display = 'block'; }

function layout(){
  W = window.innerWidth; H = window.innerHeight;
  const topY = qBox.getBoundingClientRect().bottom + 16;
  const gap = 12, usable = Math.min(W*0.92, 440);
  sw = (usable - gap) / 2; sh = Math.max(50, Math.min(64, (H - topY - 230) / 3.2));
  const x0 = W/2 - usable/2;
  slotPos = [0,1,2,3].map(i=>({ x: x0 + (i%2)*(sw+gap) + sw/2, y: topY + Math.floor(i/2)*(sh+gap) + sh/2 }));
  cw = (usable - 3*8) / 4; ch = Math.max(44, sh*0.85);
  const ty = topY + 2*(sh+gap) + 24 + ch/2;
  homePos = [0,1,2,3].map(i=>({ x: x0 + i*(cw+8) + cw/2, y: ty }));
  slotEls.forEach((el,i)=>{ el.style.width=sw+'px'; el.style.height=sh+'px'; el.style.left=(slotPos[i].x-sw/2)+'px'; el.style.top=(slotPos[i].y-sh/2)+'px'; });
  CARDS.forEach(c=>{ const el=cardEls[c.id]; el.style.width=cw+'px'; el.style.height=ch+'px'; el.style.fontSize=Math.min(22, cw*0.3)+'px'; });
  renderCards();
}
function renderCards(){
  CARDS.forEach(c=>{ const k = slotOfCard[c.id]; const p = (k===null||k===undefined) ? homePos[homeIndex[c.id]] : slotPos[k];
    const el = cardEls[c.id]; const w = (k===null||k===undefined) ? cw : Math.min(cw, sw*0.5);
    el.style.width = w+'px'; el.style.left=(p.x - w/2 - ((k===null||k===undefined)?0:sw*0.18))+'px'; el.style.top=(p.y-ch/2)+'px'; });
}
function build(){
  SLOT_NUMS.forEach((n,i)=>{ const el=document.createElement('div'); el.className='slot'; el.innerHTML='<span class="lb">10進数</span><span class="nm">'+n+'</span>'; gameLayer.appendChild(el); slotEls.push(el); });
  const order=[0,1,2,3].sort(()=>Math.random()-0.5);
  CARDS.forEach((c,i)=>{ homeIndex[c.id]=order[i]; slotOfCard[c.id]=null;
    const el=document.createElement('div'); el.className='card'; el.textContent=c.bin; gameLayer.appendChild(el); cardEls[c.id]=el; makeDraggable(c.id, el); });
}
function makeDraggable(id, el){
  let dragging=false, offX=0, offY=0;
  el.addEventListener('pointerdown', e=>{ if(cleared) return; dragging=true; try{el.setPointerCapture(e.pointerId);}catch(err){}
    const r=el.getBoundingClientRect(); offX=e.clientX-r.left; offY=e.clientY-r.top; el.style.zIndex=999; });
  el.addEventListener('pointermove', e=>{ if(!dragging) return; el.style.left=(e.clientX-offX)+'px'; el.style.top=(e.clientY-offY)+'px'; });
  const end=()=>{ if(!dragging) return; dragging=false; el.style.zIndex=35; drop(id); };
  el.addEventListener('pointerup', end); el.addEventListener('pointercancel', end);
}
function drop(id){
  const r=cardEls[id].getBoundingClientRect(); const cx=r.left+r.width/2, cy=r.top+r.height/2;
  let best=-1, bd=Infinity;
  slotPos.forEach((p,k)=>{ const d=Math.hypot(cx-p.x, cy-p.y); if(d<bd){bd=d;best=k;} });
  const prev = slotOfCard[id];
  if (bd < sw*0.7){
    const occ = cardInSlot[best];
    if (occ && occ!==id){ if(prev!==null){ cardInSlot[prev]=occ; slotOfCard[occ]=prev; } else { slotOfCard[occ]=null; } }
    else if (prev!==null && prev!==best){ cardInSlot[prev]=null; }
    cardInSlot[best]=id; slotOfCard[id]=best;
  } else { if(prev!==null) cardInSlot[prev]=null; slotOfCard[id]=null; }
  renderCards();
}
checkBtn.addEventListener('click', ()=>{
  if (cleared) return;
  if (CARDS.some(c=>slotOfCard[c.id]===null)){ setResult('4枚すべてを、枠の中に置いてください'); return; }
  const correct = CARDS.filter(c=>slotOfCard[c.id]===c.slot).length;
  if (correct===CARDS.length){ cleared=true; setResult('正解!'); setTimeout(showClear,600); return; }
  const sig = CARDS.map(c=>c.id+':'+slotOfCard[c.id]).join('|');
  if (sig===lastSig){ setResult('さっきと同じ並びです。別の並びを試してみよう'); return; }
  lastSig=sig; addMistake();
  setResult('いま '+correct+'枚 合っています(このスポットのまちがい '+spotMistakes()+'回)');
});
function showClear(){
  clearText.innerHTML='100 = 4、101 = 4+1 = 5、110 = 4+2 = 6、1001 = 8+1 = 9。<br>2進数は、右から 1・2・4・8… と、2倍ずつ大きくなる位で数えます。';
  scoreText.textContent='このスポットのまちがい '+spotMistakes()+'回 / 合計 '+totalMistakes()+'回';
  clearScreen.classList.add('show');
}
window.addEventListener('resize', ()=>{ if(gameStarted) layout(); });
targetEntity.addEventListener('targetFound', ()=>{
  searchHint.style.display='none';
  if(!gameStarted){ gameStarted=true; gameLayer.style.display='block'; qBox.style.display='block'; checkBtn.style.display='block'; build(); layout(); }
});
targetEntity.addEventListener('targetLost', ()=>{ if(!gameStarted) searchHint.style.display='block'; });
</script>
</body>
</html>
